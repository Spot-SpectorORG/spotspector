services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    expose:
      - 8000

    volumes:
      - static_files:/app/staticfiles

    env_file:
      - .env.compose

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 60 --workers 3

  nginx:
    container_name: nginx

    image: nginx:alpine-slim

    restart: unless-stopped

    depends_on:
      - api
      - react

    ports:
      - 80:80

    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - static_files:/app/staticfiles

  react:
    container_name: react

    build:
      context: .
      dockerfile: frontend/Dockerfile

    restart: unless-stopped

    expose:
      - 5134

  db:
    image: postgres:18.4

    restart: unless-stopped

    container_name: db

    volumes:
      - data:/var/lib/postgresql

    env_file:
      - .env.compose

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  data:
  static_files:
